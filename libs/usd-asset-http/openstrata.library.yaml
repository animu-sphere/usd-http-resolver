# OpenStrata plain-library descriptor.
#
# usdAssetHttp is a plain static CMake library over usdAssetIo, with no OpenUSD
# dependency (docs/architecture/WORKSPACE.md §1). Its third-party edge --
# libcurl, chosen in ADR-0003 -- is resolved by `find_package(CURL)` inside the
# module's own CMakeLists and is not an `ost` library edge: it is not a member
# of this workspace.
schema: openstrata.library/v1alpha1
library:
  id: usdAssetHttp
  version: 0.2.0
requires:
  libraries:
    # The only workspace edge a backend is allowed. Not another backend, not the
    # cache, not OpenUSD.
    - id: usdAssetIo
      version: ">=0.1,<0.3"
cmake:
  package: usdAssetHttp
  target: usdasset::http
