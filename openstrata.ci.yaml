# OpenStrata CI support matrix.
#
# This file is the source of CI semantics for everything that needs an OpenUSD
# runtime; `.github/workflows/ost-source-ci.yml` is generated from it by
# `ost ci generate github` and is never edited by hand. Regenerate after every
# change here.
#
# Two lanes in this repository are deliberately NOT expressed here, and both
# exclusions have a reason attached rather than being a matter of taste:
#
#   .github/workflows/core-ci.yml
#       The runtime-free lane: everything under libs/, the boundary suite, and
#       the hostile fixture corpus, built and tested with no OpenUSD present,
#       plus the ASan/UBSan/TSan presets. Every cell here pins and materializes
#       a runtime, which is precisely the property that lane exists to
#       disprove, and no cell shape can pass a preset or a cache variable.
#       See docs/reports/ost/01-2026-08-16-v0.1.0-ci-without-a-support-matrix.md.
#
#   .github/workflows/plugin-windows-ci.yml
#       The Windows half of the v0.2.0 exit criterion -- a stage opened over
#       HTTP on all three platforms. libcurl on Windows comes from vcpkg
#       (ADR-0003), `host_packages` renders an installer for apt and brew only,
#       and `ost build` accepts no prefix or `-D` passthrough, so a generated
#       Windows cell cannot configure this workspace at all. That lane is
#       hand-authored and installs libcurl itself -- but it consumes its pins
#       from THIS file via `ost ci matrix --json` rather than copying them,
#       which is what `workspace-graph-pr-windows` below is for.
#       See docs/reports/ost/03-2026-08-18-a-support-matrix-with-one-hand-authored-lane.md.
#
# Fork-PR safety: nothing here publishes, promotes, or uses a secret. Keep it
# that way.
schema: 1

bootstrap:
  ost:
    # The version every lane installs, including the hand-authored Windows one,
    # which parses it out of this block so there is one copy of it.
    #
    # 0.21.0 and not 0.22.2, which is what this repository is developed against,
    # and the reason is a skew between the CLI and the artifacts it consumes.
    # The published `openstrata-runtime-cy2026-usd` artifacts the cells below pin
    # were produced by `ost` 0.20.0 and carry runtime manifest schema 3;
    # `ost runtime validate` in 0.22.2 requires schema 7 and fails the runtime
    # with `manifest-schema` and `digest-integrity`, which is a step every cell
    # runs before it builds anything. It reproduces off CI: `ost runtime validate
    # cy2026 --profile usd` fails on a developer machine with 0.22.2 and passes
    # with 0.21.0 against the same materialized runtime.
    #
    # 0.21.0 is the newest CLI that accepts these runtimes, and it is what
    # `usd-vrm-plugins` pins against the same three digests. Nothing else in this
    # file changes: 0.21.0 accepts this matrix unchanged, its `ci matrix --json`
    # emits the same fields the Windows lane reads, and the command surface the
    # generated workflow uses is identical.
    #
    # `.github/workflows/ost-source-ci.yml` is therefore generated by 0.21.0 as
    # well, so the workflow and the CLI that runs it are the same version. This
    # pin moves back up when a runtime built by a newer `ost` is published.
    version: "0.21.0"
    repository: animu-sphere/open-strata

runners:
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required

cells:
  # --- the cheap gate --------------------------------------------------------
  #
  # `verify: graph` validates the workspace dependency graph and stops. It needs
  # no build and no runtime -- the generated job ends after the checkout, so the
  # pin below is recorded rather than paid for.
  #
  # This rung could not run at v0.1.0: `ost plugin test --workspace --graph-only`
  # exited PRECONDITION_FAILED with "no plugin bundles found in the workspace
  # member set", which is one of the three reasons this file did not exist yet.
  # plugins/http-resolver is the bundle that fixed it, and the rung now reports
  # 1 bundle, 3 libraries, 3 library edges, valid.
  - name: workspace-graph-pr-linux
    kind: workspace
    lane: pull_request
    runner: linux-hosted
    runtime_artifact: sha256:70b47d1b1a337b71d6c6fd63898e3295c0f91dc4b2ad2f5c09d14d6ac0ff2e1d
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:1a873111e4edf0cec7fdcf03e7bd2bbdf9723e1019cadcbcab9280c3229ac3af
      expected_oci_digest: sha256:1a873111e4edf0cec7fdcf03e7bd2bbdf9723e1019cadcbcab9280c3229ac3af
    platform: cy2026
    profile: usd
    verify: graph

  # The Windows cell, and the only one `ost` can express on this platform.
  #
  # It carries two things. The thin one is real: the dependency graph is
  # validated by a Windows `ost`, where path separators, case folding, and the
  # .strata/targets naming are not the same code path as on Linux. The
  # load-bearing one is the pin -- plugin-windows-ci.yml reads the runtime
  # artifact and its OCI reference out of this cell with `ost ci matrix --json`,
  # so the Windows runtime is declared exactly once, in the file that declares
  # the other two.
  #
  # It stops at `graph` because nothing further is reachable; see the header.
  - name: workspace-graph-pr-windows
    kind: workspace
    lane: pull_request
    runner: windows-hosted
    runtime_artifact: sha256:e3368364f8f4661a7c34371e907f2e5ddcdec4e680b76f5e9e1c1ed656022f48
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:184cdbb42e9f01d4587429f6bfb3e3700f1cdbe3a6505e966edfec90a2f617f1
      expected_oci_digest: sha256:184cdbb42e9f01d4587429f6bfb3e3700f1cdbe3a6505e966edfec90a2f617f1
    platform: cy2026
    profile: usd
    verify: graph

  # --- the release's actual claim --------------------------------------------
  #
  # `verify: test` runs `ost build` over the root CMake tree and then `ost test`
  # over its CTest suite, which is where the remote claim lives:
  # httpResolver_stage stands up tests/fixture-server on loopback with an
  # ephemeral port, opens a UsdStage over `http`, follows a relative reference
  # to a second remote layer, and asserts the `Range` header from the server's
  # own request log. A bundle cell cannot run that -- its rungs open a path from
  # `tests.smoke`, and a remote fixture is not a file in a directory (report 02,
  # section 3).
  #
  # host_packages installs what CONSUMING the runtime needs (OpenUSD 26.08's
  # MaterialX hard-requires the X11 development headers to `find_package(pxr)`)
  # plus this repository's own libcurl, which is the acquisition ADR-0003 names
  # and core-ci.yml already performs. macOS needs neither: the system libcurl is
  # in the SDK, and there is no X11 edge.
  - name: workspace-pr-linux
    kind: workspace
    lane: pull_request
    runner: linux-hosted
    runtime_artifact: sha256:70b47d1b1a337b71d6c6fd63898e3295c0f91dc4b2ad2f5c09d14d6ac0ff2e1d
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:1a873111e4edf0cec7fdcf03e7bd2bbdf9723e1019cadcbcab9280c3229ac3af
      expected_oci_digest: sha256:1a873111e4edf0cec7fdcf03e7bd2bbdf9723e1019cadcbcab9280c3229ac3af
    platform: cy2026
    profile: usd
    host_packages:
      apt: [libx11-dev, libxt-dev, libcurl4-openssl-dev]
    verify: test

  - name: workspace-pr-macos-arm64
    kind: workspace
    lane: pull_request
    runner: macos-arm64-hosted
    runtime_artifact: sha256:b2cb7b68e72b05e486d57e96cde2ec7a8dc5a17b02b774af923aa58ee31d6d21
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:f8de29a4176d02ffbcf50a2205bb6b23d9a3cd9463e0d58a28a3c1c6ee5cb82c
      expected_oci_digest: sha256:f8de29a4176d02ffbcf50a2205bb6b23d9a3cd9463e0d58a28a3c1c6ee5cb82c
    platform: cy2026
    profile: usd
    verify: test

  # --- the bundle as a bundle ------------------------------------------------
  #
  # What the workspace cells above cannot assert: that the SHIPPED shape is
  # right. L0 checks the manifest, that plugInfo.json parses, that its
  # LibraryPath points under the bundle's own lib/ for the target, that the
  # shared library is where it says, and that a session's PXR_PLUGINPATH_NAME
  # would include the bundle; L1 checks that the runtime came from an artifact
  # rather than from the host and that its OpenUSD version satisfies the
  # manifest's declared range. A CTest run cannot see any of that -- it loads
  # the library out of the build tree.
  #
  # `up_to: 1` and not 5, and the reason is recorded rather than worked around.
  # L2 (`resolver.registration`) runs
  # `Ar.GetResolver().Resolve("<scheme>:<fixture>")` and requires a non-empty
  # path. `Resolve` returning non-empty asserts that the asset EXISTS
  # (RESOLVER.md section 2.3), so for a network resolver the rung needs an
  # origin listening; and `https:C:/.../local_unchanged.usda` has no authority,
  # so it is not an absolute http(s) URI and normalizes to nothing this bundle
  # claims. The rung wants dispatch and asks for resolution. Both ways to make
  # it green -- a local-file branch in the resolver, or a fixture that is a
  # URL -- are worse than a capped cell.
  #
  # L3, L4, and L5 do pass, and they are not asserted here because they sit on
  # the far side of L2. They were walked by hand and recorded in report 02;
  # raising this to 5 is a one-line change the day `ost` asks L2 for dispatch.
  - name: http-resolver-pr-linux
    lane: pull_request
    runner: linux-hosted
    runtime_artifact: sha256:70b47d1b1a337b71d6c6fd63898e3295c0f91dc4b2ad2f5c09d14d6ac0ff2e1d
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:1a873111e4edf0cec7fdcf03e7bd2bbdf9723e1019cadcbcab9280c3229ac3af
      expected_oci_digest: sha256:1a873111e4edf0cec7fdcf03e7bd2bbdf9723e1019cadcbcab9280c3229ac3af
    bundle: plugins/http-resolver
    platform: cy2026
    profile: usd
    host_packages:
      apt: [libx11-dev, libxt-dev, libcurl4-openssl-dev]
    up_to: 1

  - name: http-resolver-pr-macos-arm64
    lane: pull_request
    runner: macos-arm64-hosted
    runtime_artifact: sha256:b2cb7b68e72b05e486d57e96cde2ec7a8dc5a17b02b774af923aa58ee31d6d21
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:f8de29a4176d02ffbcf50a2205bb6b23d9a3cd9463e0d58a28a3c1c6ee5cb82c
      expected_oci_digest: sha256:f8de29a4176d02ffbcf50a2205bb6b23d9a3cd9463e0d58a28a3c1c6ee5cb82c
    bundle: plugins/http-resolver
    platform: cy2026
    profile: usd
    up_to: 1
